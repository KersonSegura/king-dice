<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <style>
      .face-top { fill: #f5f5f5; }
      .face-left { fill: url(#grad-left); }
      .face-right { fill: url(#grad-right); }
      .dot { fill: #1a1a1a; }
    </style>
    <linearGradient id="grad-left" x1="139" y1="308" x2="256" y2="308" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0e0e0"/>
      <stop offset="0.5" stop-color="#d0d0d0"/>
      <stop offset="1" stop-color="#c0c0c0"/>
    </linearGradient>
    <linearGradient id="grad-right" x1="256" y1="308" x2="373" y2="308" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0e0e0"/>
      <stop offset="0.5" stop-color="#d0d0d0"/>
      <stop offset="1" stop-color="#c0c0c0"/>
    </linearGradient>
  </defs>
  <g id="D6-Dice">
    <!-- Three visible faces (isometric cube) -->
    <path class="face-top" d="M256,274.66l116.87-67.7L256,139.26 139.13,206.96Z"/>
    <polygon class="face-left" points="139.13 206.96 139.13 342.36 256 410.05 256 274.66 139.13 206.96"/>
    <polygon class="face-right" points="372.87 206.96 256 274.66 256 410.05 372.87 342.36 372.87 206.96"/>
    
    <!-- Top face: 1 dot (center of rhombus) -->
    <circle class="dot" cx="256" cy="207" r="16"/>
    
    <!-- Left face: 2 dots (diagonal, standard D6 layout) -->
    <circle class="dot" cx="178" cy="262" r="14"/>
    <circle class="dot" cx="218" cy="358" r="14"/>
    
    <!-- Right face: 3 dots (diagonal, standard D6 layout) -->
    <circle class="dot" cx="334" cy="262" r="14"/>
    <circle class="dot" cx="312" cy="318" r="14"/>
    <circle class="dot" cx="290" cy="358" r="14"/>
  </g>
</svg>
